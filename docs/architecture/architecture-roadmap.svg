<?xml version="1.0" encoding="UTF-8"?>
<svg width="1200" height="360" viewBox="0 0 1200 360" xmlns="http://www.w3.org/2000/svg">
  <style>
    .stage { fill:#1f77b4; stroke:#0b3a66; stroke-width:2; rx:10; ry:10; }
    .label { font-family: Inter, Arial, sans-serif; font-size:16px; fill:#ffffff; font-weight:700; }
    .sub { font-size:12px; fill:#ffffff; font-weight:500; }
    .arrow { stroke:#0b3a66; stroke-width:3; fill:none; marker-end: url(#arrowhead); }
    .lane { fill:none; stroke:#dfeaf6; stroke-dasharray:6 6; }
    .note { font-size:12px; fill:#2b2b2b; font-weight:600; }
  </style>

  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="8" refX="10" refY="4" orient="auto">
      <polygon points="0 0, 10 4, 0 8" fill="#0b3a66" />
    </marker>
  </defs>

  <!-- Title -->
  <text x="30" y="32" class="note">Architecture Roadmap: Requirements → Technical Implementation</text>

  <!-- Lanes -->
  <line x1="0" y1="80" x2="1200" y2="80" class="lane" />
  <text x="30" y="72" class="note">Business / Product</text>
  <line x1="0" y1="240" x2="1200" y2="240" class="lane" />
  <text x="30" y="232" class="note">Technical / Delivery</text>

  <!-- Stages (top lane) -->
  <g transform="translate(60,100)">
    <rect class="stage" x="0" y="0" width="200" height="80" rx="10"/>
    <text x="100" y="28" class="label" text-anchor="middle">Requirements</text>
    <text x="100" y="52" class="sub" text-anchor="middle">Stakeholders, Goals, Constraints</text>

    <rect class="stage" x="260" y="0" width="220" height="80" rx="10"/>
    <text x="370" y="28" class="label" text-anchor="middle">Analysis &amp; Specs</text>
    <text x="370" y="52" class="sub" text-anchor="middle">User Stories, Acceptance Criteria</text>

    <rect class="stage" x="520" y="0" width="220" height="80" rx="10"/>
    <text x="630" y="28" class="label" text-anchor="middle">Solution Design</text>
    <text x="630" y="52" class="sub" text-anchor="middle">High-level Modules, APIs</text>

    <rect class="stage" x="780" y="0" width="260" height="80" rx="10"/>
    <text x="910" y="28" class="label" text-anchor="middle">Architecture &amp; Tech</text>
    <text x="910" y="52" class="sub" text-anchor="middle">System Diagrams, Non-func Req</text>

    <rect class="stage" x="1060" y="0" width="220" height="80" rx="10"/>
    <text x="1170" y="28" class="label" text-anchor="middle">Technical Implementation</text>
    <text x="1170" y="52" class="sub" text-anchor="middle">Code, CI/CD, Tests</text>

    <!-- Arrows -->
    <path d="M200 40 L260 40" class="arrow" />
    <path d="M480 40 L520 40" class="arrow" />
    <path d="M740 40 L780 40" class="arrow" />
    <path d="M1040 40 L1060 40" class="arrow" />
  </g>

  <!-- Lower swim elements linking to technical concerns -->
  <g transform="translate(80,260)">
    <rect x="0" y="0" width="160" height="60" rx="8" fill="#2ca02c" stroke="#1a6d1a" stroke-width="2"/>
    <text x="80" y="22" class="label" style="font-size:14px;">TRACES</text>
    <text x="80" y="42" class="sub" text-anchor="middle">Use Cases &amp; Flows</text>

    <rect x="220" y="0" width="200" height="60" rx="8" fill="#ff7f0e" stroke="#b35200" stroke-width="2"/>
    <text x="320" y="22" class="label" style="font-size:14px;">DATA MODEL</text>
    <text x="320" y="42" class="sub" text-anchor="middle">Entities &amp; Schemas</text>

    <rect x="460" y="0" width="220" height="60" rx="8" fill="#8c564b" stroke="#4d2a27" stroke-width="2"/>
    <text x="570" y="22" class="label" style="font-size:14px;">COMPONENTS</text>
    <text x="570" y="42" class="sub" text-anchor="middle">Modules &amp; Interfaces</text>

    <rect x="700" y="0" width="220" height="60" rx="8" fill="#e377c2" stroke="#a14288" stroke-width="2"/>
    <text x="810" y="22" class="label" style="font-size:14px;">INFRA</text>
    <text x="810" y="42" class="sub" text-anchor="middle">Environments &amp; CI/CD</text>

    <rect x="940" y="0" width="260" height="60" rx="8" fill="#17becf" stroke="#0f6c73" stroke-width="2"/>
    <text x="1070" y="22" class="label" style="font-size:14px;">IMPLEMENTATION</text>
    <text x="1070" y="42" class="sub" text-anchor="middle">Code, Tests, Pipelines</text>

    <!-- Connectors up to top stages -->
    <path d="M80 0 L140 -120" class="arrow" />
    <path d="M320 0 L380 -120" class="arrow" />
    <path d="M560 0 L620 -120" class="arrow" />
    <path d="M800 0 L860 -120" class="arrow" />
    <path d="M1140 0 L1140 -120" class="arrow" />
  </g>

  <!-- Footer note -->
  <text x="30" y="340" class="note">Generated: Architecture roadmap covering Requirements → Technical Implementation. Ask for edits or alternative layouts.</text>
</svg>
